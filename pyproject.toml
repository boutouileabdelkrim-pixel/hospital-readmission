[project]
name = "hospital-readmission"
version = "0.1.0"
description = "Hospital readmission early warning: 30-day risk prediction with clinical interpretability"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "boutouileabdelkrim-pixel", email = "boutouileabdelkrim@mail.com" },
]
keywords = ["healthcare", "readmission", "xgboost", "lightgbm", "shap", "mlops"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=16.0,<20.0",
  "scipy>=1.11,<2.0",
  "scikit-learn>=1.4,<2.0",
  "xgboost>=2.0,<3.0",
  "lightgbm>=4.3,<5.0",
  "shap>=0.45,<1.0",
  "optuna>=3.6,<5.0",
  "imbalanced-learn>=0.12,<1.0",
  "matplotlib>=3.8,<4.0",
  "seaborn>=0.13,<1.0",
  "mlflow>=2.14,<3.0",
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "pre-commit>=3.7,<5.0",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ============================================================
# Ruff
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "N803",   # argument name should be lowercase (ML: X, X_train)
  "N806",   # variable in function should be lowercase (ML: X, Y)
  "E501",   # line too long (handled by formatter)
  "RUF001", # ambiguous unicode char
  "RUF002", # ambiguous unicode char in docstring
  "RUF003", # ambiguous unicode char in comment
  "B904",   # raise from in except (pedantic for notebooks)
  "B905",   # zip without strict= (py3.11 fine)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"notebooks/*" = ["E402", "F401"]

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

# ============================================================
# Coverage
# ============================================================
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/api/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
